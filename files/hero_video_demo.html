<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koneki X Lab</title>
<style>
  :root { --bg:#0a0a0b; --cream:#efede4; --red:#e83c3c; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--cream); font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* ---- HERO con video de fondo ---- */
  .hero { position: relative; min-height: 100svh; display: grid; align-items: end; overflow: hidden; }
  .hero video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* degradado para que el texto se lea sobre el video */
  .hero::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(10,10,11,.92) 0%, rgba(10,10,11,.55) 38%, rgba(10,10,11,0) 70%); }
  .hero .content { position: relative; z-index: 1; padding: clamp(24px, 6vw, 80px); max-width: 980px; }
  .kicker { font: 700 14px/1 ui-monospace, "Space Mono", monospace; letter-spacing: .2em; color: var(--red); margin-bottom: 18px; }
  h1 { font-size: clamp(34px, 6vw, 76px); line-height: 1.05; letter-spacing: -.02em; text-transform: uppercase; }
  h1 em { font-style: normal; color: var(--red); }
  p { margin-top: 20px; font-size: clamp(16px, 2vw, 22px); color: #c9c8c0; max-width: 620px; }
  .btn { display: inline-block; margin-top: 28px; background: var(--red); color: #fff; text-decoration: none;
         font-weight: 600; padding: 16px 32px; border-radius: 999px; }
  @media (prefers-reduced-motion: reduce) { .hero video { display: none; } .hero { background: url("koneki_lab_3d_logo_poster.jpg") center/cover; } }
</style>
</head>
<body>
  <section class="hero">
    <!-- autoplay funciona solo con muted + playsinline -->
    <video autoplay muted loop playsinline preload="auto" poster="koneki_lab_3d_logo_poster.jpg">
      <source src="koneki_lab_3d_logo.mp4" type="video/mp4">
    </video>
    <div class="content">
      <div class="kicker">// KONEKI X LAB</div>
      <h1>Páginas web y aplicaciones <em>web</em> a tu medida</h1>
      <p>Diseñamos y desarrollamos sitios y sistemas web que conectan tu negocio con tus clientes.</p>
      <a class="btn" href="#contacto">Contanos tu proyecto</a>
    </div>
  </section>
</body>
</html>
